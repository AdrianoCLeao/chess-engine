[package]
name = "chess-engine"
version = "0.1.0"
description = "Complete chess engine with Elo-scaled bots, move review, and coach mode"
authors = ["Adriano"]
edition = "2021"
rust-version = "1.83"

[lib]
name = "chess_engine"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.5.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[dev-dependencies]

[profile.dev]
opt-level = 1

[profile.release]
lto = false
codegen-units = 16
